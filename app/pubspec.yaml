name: vhdx_reader
description: A read-only VHDX and BitLocker file browser.
publish_to: none
version: 0.6.12+19
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.4
  file_selector: ^1.1.0
  path_provider: 2.1.6
  pdfrx: 2.11.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.11
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_macos_video: 1.1.4
  media_kit_libs_ios_video: 1.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
