[workspace]
members = ["crates/vhdx-core", "crates/vhdx-cli", "crates/vhdx-app"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libloading = "=0.7.4"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = "=0.10.9"
zeroize = "=1.9.1"
base64 = "=0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
